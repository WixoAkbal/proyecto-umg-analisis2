<div class="flex min-h-screen">
  <aside class="flex w-56 shrink-0 flex-col justify-between border-r border-gray-200 p-4">
    <div>
      <h1 class="mb-6 text-lg font-semibold">Becas</h1>
      <nav class="flex flex-col gap-1">
        <a
          routerLink="/tipos-becas"
          routerLinkActive="bg-gray-100 font-semibold"
          class="rounded px-3 py-2 hover:bg-gray-100"
        >
          Tipos de becas
        </a>
        <a
          routerLink="/convocatorias"
          routerLinkActive="bg-gray-100 font-semibold"
          class="rounded px-3 py-2 hover:bg-gray-100"
        >
          Convocatorias
        </a>
      </nav>
    </div>
    <p-button
      label="Cerrar sesión"
      icon="pi pi-sign-out"
      severity="secondary"
      [outlined]="true"
      (onClick)="cerrarSesion()"
    />
  </aside>

  <main class="min-w-0 flex-1">
    <router-outlet />
  </main>
</div>
