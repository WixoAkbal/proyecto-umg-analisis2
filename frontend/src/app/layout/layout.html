<div class="flex min-h-screen">
  <aside class="flex w-64 shrink-0 flex-col justify-between border-r border-gray-200 p-4">
    <div>
      <h1 class="mb-6 text-lg font-semibold">Becas</h1>
      <nav class="flex flex-col gap-1">
        <a
          routerLink="/tipos-becas"
          routerLinkActive="bg-gray-100 font-semibold"
          class="rounded px-3 py-2 hover:bg-gray-100"
        >
          Tipos de becas
        </a>
        <a
          routerLink="/convocatorias"
          routerLinkActive="bg-gray-100 font-semibold"
          class="rounded px-3 py-2 hover:bg-gray-100"
        >
          Convocatorias
        </a>
        @if (veSolicitudes()) {
          <a
            routerLink="/solicitudes"
            routerLinkActive="bg-gray-100 font-semibold"
            class="rounded px-3 py-2 hover:bg-gray-100"
          >
            Solicitudes
          </a>
          <a
            routerLink="/evaluaciones"
            routerLinkActive="bg-gray-100 font-semibold"
            class="rounded px-3 py-2 hover:bg-gray-100"
          >
            Evaluaciones
          </a>
                    <a
            routerLink="/reportes"
            routerLinkActive="bg-gray-100 font-semibold"
            class="rounded px-3 py-2 hover:bg-gray-100"
          >
            Reportes
          </a>
        }
        @if (veMisSolicitudes()) {
          <a
            routerLink="/mis-solicitudes"
            routerLinkActive="bg-gray-100 font-semibold"
            class="rounded px-3 py-2 hover:bg-gray-100"
          >
            Mis solicitudes
          </a>
        }
        <a
          routerLink="/notificaciones"
          routerLinkActive="bg-gray-100 font-semibold"
          class="rounded px-3 py-2 hover:bg-gray-100"
        >
          Notificaciones
        </a>
        @if (esAdmin()) {
                    <a
            routerLink="/comites"
            routerLinkActive="bg-gray-100 font-semibold"
            class="rounded px-3 py-2 hover:bg-gray-100"
          >
            Comités
          </a>
          <p class="mt-4 px-3 text-xs font-semibold uppercase text-gray-500">Catálogos</p>
          <a
            routerLink="/catalogos/niveles-academicos"
            routerLinkActive="bg-gray-100 font-semibold"
            class="rounded px-3 py-2 hover:bg-gray-100"
          >
            Niveles académicos
          </a>
          <a
            routerLink="/catalogos/tipos-documentos"
            routerLinkActive="bg-gray-100 font-semibold"
            class="rounded px-3 py-2 hover:bg-gray-100"
          >
            Tipos de documentos
          </a>
          <a
            routerLink="/catalogos/estados-convocatorias"
            routerLinkActive="bg-gray-100 font-semibold"
            class="rounded px-3 py-2 hover:bg-gray-100"
          >
            Estados de convocatoria
          </a>
          <a
            routerLink="/catalogos/estados-solicitudes"
            routerLinkActive="bg-gray-100 font-semibold"
            class="rounded px-3 py-2 hover:bg-gray-100"
          >
            Estados de solicitud
          </a>
        }
      </nav>
    </div>
    <p-button
      label="Cerrar sesión"
      icon="pi pi-sign-out"
      severity="secondary"
      [outlined]="true"
      (onClick)="cerrarSesion()"
    />
  </aside>

  <main class="min-w-0 flex-1">
    <router-outlet />
  </main>
</div>
